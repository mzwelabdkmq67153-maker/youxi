<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>hero3d 部件检查台</title>
<style>
  html,body{margin:0;height:100%;background:#0b0e12;overflow:hidden;font:12px/1.6 system-ui,"Microsoft YaHei"}
  #bar{position:fixed;left:10px;bottom:10px;display:flex;gap:6px;flex-wrap:wrap;z-index:9}
  button{background:#1a2028;color:#cfe3f2;border:1px solid #33404e;border-radius:8px;padding:6px 10px;cursor:pointer}
  button.on{background:#2a3f52;border-color:#6fe4ff;color:#eaf7ff}
  #hint{position:fixed;right:12px;top:10px;color:#7f8f9e;text-align:right}
</style>
</head>
<body>
<div id="hint">hero3d · 角色近景检查<br><span id="stat"></span></div>
<div id="bar"></div>
<script src="vendor/three.min.js"></script>
<script src="hero3d.js"></script>
<script>
(function () {
  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b0e12);
  var camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.01, 20);
  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.80;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  var hemi = new THREE.HemisphereLight(0xd8e8f6, 0x6b6153, 0.70);
  scene.add(hemi);
  var key = new THREE.DirectionalLight(0xfff2dc, 0.78);
  key.position.set(0.8, 2.4, -1.6);
  key.castShadow = true;
  scene.add(key);
  var rim = new THREE.DirectionalLight(0xcfd9e0, 0.32);
  rim.position.set(-1.2, 1.4, 1.4);
  scene.add(rim);

  var ground = new THREE.Mesh(new THREE.CircleGeometry(3, 40),
    new THREE.MeshStandardMaterial({ color: 0x40474e, roughness: 0.9 }));
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  var kinds = ['swordsman', 'gunner', 'warlock', 'grunt', 'boss'];
  var views = {
    face: { pos: [0.07, 1.66, -0.72], look: [0, 1.645, 0], label: '面部' },
    torso: { pos: [0.20, 1.30, -0.70], look: [0, 1.28, 0], label: '胸甲' },
    hand: { pos: [0.42, 0.90, -0.55], look: [0.22, 0.85, -0.10], label: '手与武器' },
    full: { pos: [0.0, 1.05, -3.6], look: [0, 1.0, 0], label: '全身' },
    feet: { pos: [0.26, 0.55, -0.80], look: [0.10, 0.20, 0], label: '腿脚' }
  };
  var cur = { kind: 'swordsman', view: 'face' };
  var model = null;

  function rebuild() {
    if (model) scene.remove(model);
    model = Hero3D.build(cur.kind, {});
    scene.add(model);
    applyView();
  }
  function applyView() {
    var v = views[cur.view];
    camera.position.set(v.pos[0], v.pos[1], v.pos[2]);
    camera.lookAt(v.look[0], v.look[1], v.look[2]);
  }

  var bar = document.getElementById('bar');
  function btn(txt, on, fn) {
    var b = document.createElement('button');
    b.textContent = txt;
    if (on) b.className = 'on';
    b.onclick = fn;
    bar.appendChild(b);
    return b;
  }
  kinds.forEach(function (k) {
    btn(k, k === cur.kind, function () { cur.kind = k; render(); });
  });
  Object.keys(views).forEach(function (k) {
    btn(views[k].label, k === cur.view, function () { cur.view = k; applyView(); render(); });
  });

  function render() {
    bar.innerHTML = '';
    kinds.forEach(function (k) {
      btn(k, k === cur.kind, function () { cur.kind = k; rebuild(); });
    });
    Object.keys(views).forEach(function (k) {
      btn(views[k].label, k === cur.view, function () { cur.view = k; applyView(); });
    });
    rebuild();
  }

  var t = 0;
  function loop() {
    requestAnimationFrame(loop);
    var dt = 0.016;
    t += dt;
    if (model) Hero3D.update(model, dt, { speed: cur.kind === 'boss' ? 0 : 0 });
    renderer.render(scene, camera);
  }

  addEventListener('resize', function () {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  rebuild();
  loop();
  document.getElementById('stat').textContent = 'Triangles ' + renderer.info.render.triangles;
})();
</script>
</body>
</html>
