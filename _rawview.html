<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>raw GLB view</title>
<style>html,body{margin:0;height:100%;background:#2a2f36;overflow:hidden}canvas{display:block}#hud{position:fixed;left:8px;top:8px;color:#cfe;font:12px/1.5 monospace;white-space:pre}</style>
</head>
<body>
<div id="hud">loading…</div>
<script src="vendor/three.min.js"></script>
<script src="vendor/GLTFLoader.js"></script>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var url = q.get('u');
  var hud = document.getElementById('hud');
  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(1);
  renderer.setSize(innerWidth, innerHeight);
  document.body.appendChild(renderer.domElement);
  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x30363d);
  var camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.01, 200);
  scene.add(new THREE.HemisphereLight(0xdfe9f2, 0x2b3138, 1.1));
  var key = new THREE.DirectionalLight(0xffffff, 1.3); key.position.set(4, 8, 6); scene.add(key);
  var fill = new THREE.DirectionalLight(0x9db8d0, 0.5); fill.position.set(-6, 3, -4); scene.add(fill);
  new THREE.GLTFLoader().load(url, function (g) {
    var root = g.scene;
    scene.add(root);
    root.updateMatrixWorld(true);
    var box = new THREE.Box3().setFromObject(root);
    var size = new THREE.Vector3(); box.getSize(size);
    var ctr = new THREE.Vector3(); box.getCenter(ctr);
    var tris = 0, meshes = 0;
    root.traverse(function (o) {
      if (o.isMesh && o.geometry) {
        meshes++;
        var c = o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count;
        tris += Math.floor(c / 3);
        var ms = Array.isArray(o.material) ? o.material : [o.material];
        ms.forEach(function (m) {
          if (!m) return;
          m.side = THREE.DoubleSide;
          if (m.metalness > 0.2) m.metalness = 0;
          m.roughness = 0.9;
        });
      }
    });
    var dist = Math.max(size.x, size.y, size.z) * 1.6;
    var ang = parseFloat(q.get('ang') || '0');
    camera.position.set(ctr.x + Math.sin(ang) * dist, ctr.y + size.y * 0.15, ctr.z + Math.cos(ang) * dist);
    camera.lookAt(ctr);
    hud.textContent = 'meshes=' + meshes + ' tris=' + tris +
      '\nsize=' + size.x.toFixed(2) + ' x ' + size.y.toFixed(2) + ' x ' + size.z.toFixed(2) +
      '\nfile=' + url.split('/').pop();
    document.title = 'RAW ' + JSON.stringify({ tris: tris, meshes: meshes, h: +size.y.toFixed(2) });
    renderer.render(scene, camera);
    setInterval(function () { renderer.render(scene, camera); }, 200);
  }, undefined, function (e) { hud.textContent = 'load error: ' + e; document.title = 'RAW-ERR'; });
})();
</script>
</body>
</html>
