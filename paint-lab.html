<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>立绘贴图验收 · paint.js</title>
<style>
  html, body { margin: 0; padding: 0; background: #f1ede4; }
  canvas#shot { display: block; }
</style>
</head>
<body>
<canvas id="shot" width="2000" height="1430"></canvas>
<script src="vendor/three.min.js"></script>
<script src="art.js"></script>
<script src="paint.js"></script>
<script>
(function () {
  var W = 2000, H = 1430;
  var cv = document.getElementById('shot');
  var ctx = cv.getContext('2d');

  var renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.setSize(380, 470);
  renderer.setClearColor(0xb9c2c8, 1);
  var scene = new THREE.Scene();

  var hemi = new THREE.HemisphereLight(0xdfe9ff, 0x2b3440, 0.62);
  scene.add(hemi);
  var key = new THREE.DirectionalLight(0xffffff, 1.05);
  key.position.set(2.6, 4.2, -2.4);
  scene.add(key);
  var rim = new THREE.DirectionalLight(0x9fd0ff, 0.42);
  rim.position.set(-2.4, 2.2, 2.8);
  scene.add(rim);

  var ground = new THREE.Mesh(
    new THREE.CircleGeometry(9, 40),
    new THREE.MeshStandardMaterial({ color: 0x8d959b, roughness: 0.96, metalness: 0 })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  function label(t, x, y, size, color, bold) {
    ctx.fillStyle = color || '#1f2a33';
    ctx.font = (bold ? '600 ' : '400 ') + size + 'px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText(t, x, y);
  }

  function cell(grp, x, y, cw, ch, hHint, title, note, yaw) {
    scene.add(grp);
    var box = new THREE.Box3().setFromObject(grp);
    var h = Math.max(0.9, box.max.y - box.min.y);
    grp.position.set(0, 0, 0);
    grp.rotation.y = yaw || 0;
    var cam = new THREE.PerspectiveCamera(30, cw / ch, 0.1, 60);
    var d = h * 2.15;
    cam.position.set(d * 0.55, h * 0.66, -d * 0.92);
    cam.lookAt(0, h * 0.50, 0);
    renderer.render(scene, cam);
    ctx.drawImage(renderer.domElement, x, y, cw, ch);
    ctx.strokeStyle = 'rgba(31,42,51,0.28)';
    ctx.strokeRect(x + 0.5, y + 0.5, cw - 1, ch - 1);
    label(title, x, y - 14, 19, '#1f2a33', true);
    if (note) label(note, x, y + ch + 26, 14, '#5d6b77');
    grp.rotation.y = 0;
    scene.remove(grp);
  }

  function run() {
    ctx.fillStyle = '#f1ede4';
    ctx.fillRect(0, 0, W, H);
    label('立绘贴图 · 3D 模型验收', 70, 84, 40, '#1f2a33', true);
    label('paint.js：从立绘裁出甲面 / 衣褶 / 肤面三块画法样本，做无缝平铺后按部位主色重新着色，再挂到 art.js 的合并网格上',
      70, 122, 17, '#5d6b77');

    var CW = 380, CH = 470, X0 = 70, Y0 = 200, GAPY = 620;

    var heroes = [
      ['swordsman', '剑客 · 贴图后', 1.86, 0.42],
      ['gunner', '枪手 · 贴图后', 1.86, 0.42],
      ['warlock', '术士 · 贴图后', 1.86, 0.42]
    ];
    heroes.forEach(function (h, i) {
      var grp = window.ArenaArt.buildHero(h[0]);
      cell(grp, X0 + i * (CW + 40), Y0, CW, CH, h[2], h[1], '甲/衣/肤三槽贴立绘笔触，点缀槽保持自发光', h[3]);
    });

    // 对照：同款模型关掉贴图
    var raw = window.ArenaArt.buildHero('swordsman');
    raw.traverse(function (o) {
      if (o.isMesh && o.material && o.material.map) {
        o.material.map = null;
        o.material.color.setHex(0x9aa6b2);   // 剑客甲色
        o.material.needsUpdate = true;
      }
    });
    cell(raw, X0 + 3 * (CW + 40), Y0, CW, CH, 1.86, '对照 · 剑客未贴图', '同一网格、同一灯光，只去掉贴图，用来看笔触到底加了多少', 0.42);

    var foes = [
      ['grunt', '小兵 grunt', 1.05, '朱红点缀，甲面借剑客的画法源换主色'],
      ['shooter', '枪手兵 shooter', 1.05, '琥珀点缀，枪管走甲槽贴图'],
      ['elite', '精英 elite', 1.34, '体型 ×1.24，披风同样是衣褶贴图'],
      ['boss', '首领 boss', 2.1, '体型 ×1.85，贴图不随体型拉伸']
    ];
    foes.forEach(function (f, i) {
      var grp = window.ArenaArt.buildFighter(f[0]);
      cell(grp, X0 + i * (489), Y0 + GAPY, CW, CH, f[2], f[3], f[4], 0.5);
    });

    // 右侧：三块画法样本本身
    var tx = X0 + 4 * 489 + 20;
    label('画法样本', tx, Y0 + GAPY - 14, 19, '#1f2a33', true);
    ['armor', 'cloth', 'skin'].forEach(function (slot, i) {
      var t = window.ArenaPaint.texture('swordsman', slot);
      if (!t || !t.image) return;
      ctx.drawImage(t.image, tx, Y0 + GAPY + i * 152, 132, 132);
      ctx.strokeStyle = 'rgba(31,42,51,0.28)';
      ctx.strokeRect(tx + 0.5, Y0 + GAPY + i * 152 + 0.5, 131, 131);
      label(slot, tx + 144, Y0 + GAPY + i * 152 + 62, 15, '#5d6b77');
    });

    var tris = 0, meshes = 0;
    var g0 = window.ArenaArt.buildHero('swordsman');
    g0.traverse(function (o) { if (o.isMesh && o.userData.part !== 'shadow') { meshes++; tris += o.geometry.attributes.position.count / 3; } });
    label('剑客：' + tris + ' 三角面 / ' + meshes + ' 个材质批次（甲·衣·缀·肤），贴图不增加 drawcall，只多 1 次纹理绑定',
      70, H - 34, 16, '#5d6b77');

    document.title = 'paint-lab-ready';
    window.__ready = true;
  }

  // 等立绘解码完再渲染，避免贴图为空
  var waited = 0;
  (function wait() {
    if (window.ArenaPaint && window.ArenaPaint.ready()) { run(); return; }
    if (waited > 60) { run(); return; }
    waited++;
    setTimeout(wait, 120);
  })();
})();
</script>
</body>
</html>
