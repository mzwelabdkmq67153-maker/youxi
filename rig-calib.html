<!DOCTYPE html>
<html lang="zh">
<head><meta charset="utf-8"><style>html,body{margin:0;background:#efebe2}#c{display:block}</style></head>
<body>
<canvas id="c" width="1860" height="760"></canvas>
<script src="vendor/three.min.js"></script>
<script src="rig.js"></script>
<script>
var ctx = document.getElementById('c').getContext('2d');
var R3 = new THREE.WebGLRenderer({antialias: true});
R3.setSize(300, 700); R3.setPixelRatio(1); R3.setClearColor(0xdedad1, 1);
var scene = new THREE.Scene();
scene.add(new THREE.AmbientLight(0xffffff, 0.62));
var d1 = new THREE.DirectionalLight(0xffffff, 0.85); d1.position.set(2.2, 3.0, -3.2); scene.add(d1);
var d2 = new THREE.DirectionalLight(0xbcd0e0, 0.36); d2.position.set(-2.4, 1.2, 2.6); scene.add(d2);
var cam = new THREE.PerspectiveCamera(32, 300 / 700, 0.05, 20);
cam.position.set(-2.0, 1.55, -2.4); cam.lookAt(0, 1.0, 0); cam.updateProjectionMatrix();

var CASES = [
  ['G hz 0', { hand_R: [0.2, 0, 0] }],
  ['H hz +0.8', { hand_R: [0.2, 0, 0.8] }],
  ['I hz +1.4', { hand_R: [0.2, 0, 1.4] }],
  ['J hz -0.8', { hand_R: [0.2, 0, -0.8] }],
  ['K hz +1.4 hx 0.9', { hand_R: [0.9, 0, 1.4] }],
  ['L hz +1.4 hx -0.6', { hand_R: [-0.6, 0, 1.4] }]
];
CASES.forEach(function (c, i) {
  var rig = window.ArenaRig.buildRig('swordsman');
  var pose = { upperarm_R: [-0.6, 0, -0.9], forearm_R: [-0.5, 0, 0], hand_R: c[1].hand_R, upperarm_L: [0, 0, 0.34], forearm_L: [-0.10, 0, 0.06] };
  window.ArenaRig.applyPose(rig, pose);
  scene.add(rig);
  R3.render(scene, cam);
  ctx.drawImage(R3.domElement, i * 310, 40, 300, 700);
  ctx.fillStyle = '#1a1a1a'; ctx.font = 'bold 20px monospace';
  ctx.fillText(c[0], i * 310 + 12, 30);
  scene.remove(rig);
});
</script>
</body></html>
